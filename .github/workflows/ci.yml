# Unit tests, lint, screenshot comparison and an unsigned release build on every pull request
# and every push to main. Read-only token; no secrets, no signing key, nothing is published.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Also validates gradle-wrapper.jar against the published checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit tests, lint, screenshots
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:verifyRoborazziDebug

      - name: Unsigned release build
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Keep reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/outputs/roborazzi/
          retention-days: 7
